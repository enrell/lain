# Toolchain pinning for development. The same versions are used by CI
# (.github/workflows) and by the Docker build (Dockerfile), so a local
# `mise install` reproduces the exact toolchain:
#   rust  -> rustup stable in CI, the Dockerfile build stage
#   node  -> setup-node, Dockerfile web stage
#   pnpm  -> pnpm/action-setup, Dockerfile web stage
[tools]
rust = "1.99.1"
node = "26.8.2"
pnpm = "12.3.4"
just = "1.58.0"
