# Development stack with hot reload: `just up`.
#   api → the lain server on :9360, rebuilt and restarted on every source edit (bind mount).
#   web → Vite HMR on :5173, proxied to the API.
# Data lives in the `lain-dev-data` volume: never the production database.
# Media is your own ~/Videos (plus ~/Comics and ~/Manga for the reading
# slice), mounted read-only.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /src
    command: ["cargo", "run", "-p", "lain", "--", "serve", "--data-dir", "/data", "--port", "9360", "--bind", "0.0.0.0"]
    volumes:
      - .:/src
      - cargo-target:/src/target
      - cargo-registry:/usr/local/cargo/registry
      - lain-dev-data:/data
      - ${HOME}/Videos:/media/videos
      - ${HOME}/Comics:/media/comics
      - ${HOME}/Manga:/media/manga
      # Optional Omarchy palette bridge. /dev/null keeps the fallback outside Omarchy.
      - ${LAIN_OMARCHY_CURRENT:-/dev/null}:/omarchy/current:ro
    ports:
      - "${LAIN_DEV_PORT:-9360}:9360"
    environment:
      CARGO_BUILD_JOBS: "4"
      LAIN_OMARCHY_COLORS: /omarchy/current/theme/colors.toml
      # Dev container runs full log: every request plus provider-level
      # diagnostics (see docs/LOGGING.md). Agents grep this stream.
      LAIN_LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9360/health"]
      interval: 30s
      timeout: 5s
      # The first start compiles the workspace.
      start_period: 600s
      retries: 3
    develop:
      watch:
        - path: ./crates
          action: restart
        - path: ./Cargo.toml
          action: restart
        - path: ./Cargo.lock
          action: restart

  web:
    image: node:26-alpine
    working_dir: /web
    # pnpm install runs inside the container on every (re)create; the
    # install takes ~30s once, then Vite HMR is instant.
    command: sh -c "npm install -g pnpm@12.3.4 && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/web
      - web-modules:/web/node_modules
    ports:
      - "5173:5173"
    environment:
      LAIN_BACKEND: http://api:9360
    depends_on:
      api:
        condition: service_started

volumes:
  lain-dev-data:
  cargo-target:
  cargo-registry:
  web-modules:
