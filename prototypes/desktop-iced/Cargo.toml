[package]
name = "lain-desktop-iced"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
build = "build.rs"

# Own workspace: the prototype must not touch the main workspace or its lock.
[workspace]

[[bin]]
name = "lain-iced"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "image", "advanced", "crisp", "web-colors"] }
lain-client = { path = "../../crates/lain-client" }
mpv-engine = { version = "0.2.1", features = ["export"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Exactly the generation wgpu-hal 27's DX12 backend speaks, so
# ID3D12Resource/HANDLE are the same types wgpu-hal takes.
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12"] }

[profile.release]
codegen-units = 4
