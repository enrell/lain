name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  web:
    name: web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build
          if-no-files-found: error
          retention-days: 3

  # One lain binary per platform, the SPA embedded. Linux builds are
  # static (musl), like the Go builds they replace, so the installer's
  # asset names (lain_<version>_linux_<arch>.tar.gz) stay the same.
  binaries:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    needs: web
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: darwin, arch: amd64, runner: macos-15, target: x86_64-apple-darwin }
          - { os: darwin, arch: arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { os: windows, arch: amd64, runner: windows-2025, target: x86_64-pc-windows-msvc }
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Embed the web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: crates/lain/webui
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends musl-tools; fi
      - name: Build binary and package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          LAIN_VERSION="$GITHUB_REF_NAME" cargo build --release --locked -p lain --target ${{ matrix.target }}
          name="lain_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          dir="target/${{ matrix.target }}/release"
          if [ "${{ matrix.os }}" = windows ]; then
            7z a -tzip "${name}.zip" "./${dir}/lain.exe" >/dev/null
            archive="${name}.zip"
          else
            tar -czf "${name}.tar.gz" -C "$dir" lain
            archive="${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "${archive}.sha256"; else shasum -a 256 "$archive" > "${archive}.sha256"; fi
          cat "${archive}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: lain-${{ matrix.os }}-${{ matrix.arch }}
          path: lain_*
          if-no-files-found: error

  release:
    name: GitHub release + attestation
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: lain-*
          merge-multiple: true
      - name: Combined checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum lain_*.tar.gz lain_*.zip > checksums.txt
          cat checksums.txt
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/*.sha256 dist/checksums.txt \
            --generate-notes --verify-tag

  # The signed Android APK (D-278), attached to the release once it
  # exists: it needs the release, so the server's assets never wait for
  # it, and it is skipped (green, with a notice) when the signing secret
  # is not set. The secrets reach only the steps that use them.
  android:
    name: android (signed APK)
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
        working-directory: apps/android
    steps:
      - name: Signing key
        id: key
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.LAIN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::LAIN_ANDROID_KEYSTORE_BASE64 is not set; no Android APK for this release."
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - name: Toolchain
        if: steps.key.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android,x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      - uses: actions/setup-java@v6
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.key.outputs.present == 'true'
      - name: Rust libraries and Kotlin bindings
        if: steps.key.outputs.present == 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-rust.sh
      # The version name and code come from the tag (v0.3.1 -> 0.3.1,
      # 3001) in build.gradle.kts, so a rebuilt tag gets the same code.
      - name: Signed release APK
        if: steps.key.outputs.present == 'true'
        env:
          LAIN_VERSION: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.LAIN_ANDROID_KEYSTORE_BASE64 }}
          LAIN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LAIN_ANDROID_KEYSTORE_PASSWORD }}
          LAIN_ANDROID_KEY_ALIAS: ${{ secrets.LAIN_ANDROID_KEY_ALIAS }}
          LAIN_ANDROID_KEY_PASSWORD: ${{ secrets.LAIN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export LAIN_ANDROID_KEYSTORE="$RUNNER_TEMP/lain-release.jks"
          trap 'rm -f "$LAIN_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$LAIN_ANDROID_KEYSTORE"
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
          apk="lain_${GITHUB_REF_NAME#v}_android.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # The certificate it is signed with (public), and never the debug key.
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs "$apk")"
          grep -E 'certificate (DN|SHA-256 digest)' <<<"$certs"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::the APK is signed with a debug key"
            exit 1
          fi
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
      - name: Attach to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" lain_*_android.apk lain_*_android.apk.sha256
