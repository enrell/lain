name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The web SPA builds first: the lain binary embeds it (crates/lain/build.rs).
  web:
    name: web check, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check
        working-directory: web
        run: pnpm check
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build
          if-no-files-found: error
          retention-days: 3

  rust:
    name: rust test (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
      - name: Embed the web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: crates/lain/webui
      - name: Toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustc --version
      # The watch module's tests run the real ffmpeg/ffprobe (D-190);
      # LAIN_REQUIRE_FFMPEG below makes a missing one a failure.
      - name: ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -hide_banner -version | head -1
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        # A hung network test fails the job instead of holding it.
        timeout-minutes: 25
        run: LAIN_REQUIRE_FFMPEG=1 cargo test --workspace --locked --no-fail-fast

  desktop:
    # The GPUI desktop app (apps/desktop, its own cargo workspace and
    # Cargo.lock). Build and unit tests only: no GUI runs in CI. libmpv
    # is loaded at run time, so no mpv is needed to build.
    name: desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      # Overrides apps/desktop/.cargo/config.toml (a local C: path).
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries (GPUI on X11/Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add wasm32-wasip2
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}-${{ hashFiles('apps/desktop/src/**', 'crates/lain-client/src/**', 'crates/lain-api/src/**', 'crates/lain-http/src/**', 'crates/lain-ext-api/**', 'examples/extensions/**') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}-
            desktop-${{ runner.os }}-
      - name: Format
        if: runner.os == 'Linux'
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path ../../crates/lain-ext-api/Cargo.toml --all -- --check
          cargo fmt --manifest-path ../../examples/extensions/seasonal-stats/Cargo.toml -- --check
      # Extensions (P6, D-262): the guest SDK, the host tests' probe guest
      # and the sample, built to wasm32-wasip2 components.
      - name: Extension guests
        run: |
          cargo clippy --locked --release --target wasm32-wasip2 --manifest-path ../../crates/lain-ext-api/Cargo.toml --workspace -- -D warnings
          cargo clippy --locked --release --target wasm32-wasip2 --manifest-path ../../examples/extensions/seasonal-stats/Cargo.toml -- -D warnings
          cargo build --locked --release --target wasm32-wasip2 --manifest-path ../../crates/lain-ext-api/Cargo.toml --workspace
          cargo build --locked --release --target wasm32-wasip2 --manifest-path ../../examples/extensions/seasonal-stats/Cargo.toml
          ls -l "$CARGO_TARGET_DIR/wasm32-wasip2/release/"*.wasm
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        # The extension host tests load the guests built above and fail
        # (not skip) without them.
        env:
          LAIN_EXT_GUESTS: ${{ env.CARGO_TARGET_DIR }}/wasm32-wasip2/release
          LAIN_REQUIRE_EXT_GUESTS: "1"
        run: cargo test --locked
      - name: Sample extension
        if: runner.os == 'Linux'
        run: |
          mkdir -p seasonal-stats
          cp ../../examples/extensions/seasonal-stats/extension.json "$CARGO_TARGET_DIR/wasm32-wasip2/release/seasonal_stats.wasm" seasonal-stats/
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: seasonal-stats-wasm
          path: apps/desktop/seasonal-stats/

  android:
    # The Android app (apps/android, D-245..D-254): lain-ffi (its own cargo
    # workspace) is checked and tested on the host, built for the two
    # ABIs with cargo-ndk, its Kotlin bindings generated, then Gradle
    # runs the JVM unit tests (the bindings smoke test against the host
    # library) and assembles the debug APK. The runner image ships the
    # Android SDK and NDK; nothing is installed locally (D-251).
    name: android (lain-ffi, APK)
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt \
            --target aarch64-linux-android,x86_64-linux-android
          rustc --version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            apps/android/lain-ffi/target
          key: android-${{ hashFiles('apps/android/lain-ffi/Cargo.lock') }}-${{ hashFiles('apps/android/lain-ffi/src/**', 'crates/lain-client/src/**', 'crates/lain-api/src/**', 'crates/lain-read/src/**') }}
          restore-keys: |
            android-${{ hashFiles('apps/android/lain-ffi/Cargo.lock') }}-
            android-
      - name: cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked --version 4.1.2
      - name: Lint the build script
        run: sh -n scripts/build-rust.sh && shellcheck scripts/build-rust.sh
      - name: Format (lain-ffi)
        run: cargo fmt --manifest-path lain-ffi/Cargo.toml -- --check
      - name: Clippy (lain-ffi)
        run: cargo clippy --manifest-path lain-ffi/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test (lain-ffi, end to end against the server in-process)
        timeout-minutes: 20
        run: cargo test --manifest-path lain-ffi/Cargo.toml --locked --no-fail-fast
      - name: Rust libraries and Kotlin bindings
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-rust.sh
          find app/generated -name '*.kt' -exec sh -c 'echo "$1"; grep -m1 "^package" "$1"' _ {} \;
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug -PlainHostLib="$PWD/lain-ffi/target/debug/liblain_ffi.so"
      - uses: actions/upload-artifact@v7
        with:
          name: lain-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: apps/android/app/build/reports/
          retention-days: 7

  conformance:
    name: conformance (lain server)
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Embed the web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: crates/lain/webui
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustc --version
      - name: ffmpeg (watch suite clips and transcodes)
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - name: Lint the runner scripts
        run: sh -n conformance/run.sh && sh -n conformance/make-clips.sh && shellcheck conformance/run.sh conformance/make-clips.sh
      - name: Run the suite
        run: LAIN_REQUIRE_FFMPEG=1 conformance/run.sh
      - name: The binary serves the SPA
        run: |
          set -eu
          d=$(mktemp -d)
          LAIN_ACQUIRE_LISTEN_PORT=0 target/debug/lain serve --data-dir "$d" --port 19470 &
          trap 'kill $!' EXIT
          for _ in $(seq 100); do curl -fsS http://127.0.0.1:19470/health >/dev/null 2>&1 && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:19470/library | grep -q '<!doctype html>'
          curl -fsSI http://127.0.0.1:19470/ | grep -qi '^cache-control: no-cache'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19470/api/nope)" = 404

  smoke:
    # The browser smoke test (web/e2e/smoke.mjs): the release binary with
    # the web build embedded, a fresh data dir, the synthetic media and a
    # headless Chrome through every user flow, real ffmpeg transcodes
    # included. web/e2e/run-smoke.sh is the whole run, the same one a
    # developer runs locally. It lives here rather than in a workflow of
    # its own so it reuses the web job's build instead of making another.
    name: browser smoke
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Embed the web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: crates/lain/webui
      # Node >= 22 for the built-in WebSocket; the test uses no packages.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: smoke-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml') }}
          restore-keys: |
            smoke-${{ hashFiles('Cargo.lock') }}-
            smoke-
      - name: ffmpeg (fixtures and transcodes)
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - name: Lint the runner scripts
        run: |
          sh -n web/e2e/run-smoke.sh && bash -n web/e2e/fixtures.sh
          shellcheck web/e2e/run-smoke.sh web/e2e/fixtures.sh
      - name: Server (release, web embedded)
        run: cargo build --release --locked -p lain
      # The runner image's Google Chrome: it decodes H.264 and AAC, which
      # the direct-play steps need (the image's Chromium build does not).
      - name: Browser
        run: |
          echo "CHROME=$(command -v google-chrome)" >>"$GITHUB_ENV"
          google-chrome --version
      - name: Smoke test
        timeout-minutes: 15
        env:
          # A throwaway VM whose only page is the local server.
          CHROME_FLAGS: --no-sandbox
        run: web/e2e/run-smoke.sh "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-failure
          path: |
            ${{ runner.temp }}/smoke/server.log
            ${{ runner.temp }}/smoke/*.png
          if-no-files-found: ignore
          retention-days: 7

  installer:
    name: installer script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint and test
        run: |
          bash -n scripts/install.sh
          shellcheck scripts/install.sh
          python3 scripts/install_test.py
