name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go vet, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Placeholder web UI for embed (dist is gitignored)
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep
      - name: Vet
        run: go vet ./...
      - name: Test
        run: CGO_ENABLED=1 go test -race -shuffle=on -tags e2e ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=ci" -o /tmp/lain ./cmd/lain
      - name: Installer tests
        run: |
          bash -n scripts/install.sh
          shellcheck scripts/install.sh
          python3 scripts/install_test.py

  rust:
    name: rust test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
      # The Go server builds the component the Rust host runs in the
      # interop test (crates/lain-component/tests/go_interop.rs).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Placeholder web UI for embed (dist is gitignored)
        shell: bash
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep
      - name: Toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustc --version
      # The watch module's tests run the real ffmpeg/ffprobe (D-190);
      # LAIN_REQUIRE_FFMPEG below makes a missing one a failure.
      - name: ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -hide_banner -version | head -1
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        # A hung network test fails the job instead of holding it.
        timeout-minutes: 25
        run: |
          if [ "$RUNNER_OS" != Windows ]; then export LAIN_REQUIRE_GO=1; fi
          export LAIN_REQUIRE_FFMPEG=1
          cargo test --workspace --locked --no-fail-fast

  desktop:
    # The GPUI desktop app (apps/desktop, its own cargo workspace and
    # Cargo.lock). Build and unit tests only: no GUI runs in CI. libmpv
    # is loaded at run time, so no mpv is needed to build.
    name: desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      # Overrides apps/desktop/.cargo/config.toml (a local C: path).
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries (GPUI on X11/Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}-${{ hashFiles('apps/desktop/src/**', 'crates/lain-client/src/**', 'crates/lain-api/src/**') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}-
            desktop-${{ runner.os }}-
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  conformance:
    name: conformance (Go and Rust servers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustc --version
      - name: ffmpeg (watch suite clips and transcodes)
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - name: Lint the runner scripts
        run: sh -n conformance/run.sh && sh -n conformance/make-clips.sh && shellcheck conformance/run.sh conformance/make-clips.sh
      - name: Run the suite against both servers
        run: LAIN_REQUIRE_FFMPEG=1 conformance/run.sh

  web:
    name: web check, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check
        working-directory: web
        run: pnpm check
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build
