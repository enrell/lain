name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The web SPA builds first: the lain binary embeds it (crates/lain/build.rs).
  web:
    name: web check, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check
        working-directory: web
        run: pnpm check
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build
          if-no-files-found: error
          retention-days: 3

  rust:
    name: rust test (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
      - name: Embed the web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: crates/lain/webui
      - name: Toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustc --version
      # The watch module's tests run the real ffmpeg/ffprobe (D-190);
      # LAIN_REQUIRE_FFMPEG below makes a missing one a failure.
      - name: ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -hide_banner -version | head -1
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        # A hung network test fails the job instead of holding it.
        timeout-minutes: 25
        run: LAIN_REQUIRE_FFMPEG=1 cargo test --workspace --locked --no-fail-fast

  desktop:
    # The GPUI desktop app (apps/desktop, its own cargo workspace and
    # Cargo.lock). Build and unit tests only: no GUI runs in CI. libmpv
    # is loaded at run time, so no mpv is needed to build.
    name: desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      # Overrides apps/desktop/.cargo/config.toml (a local C: path).
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries (GPUI on X11/Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}-${{ hashFiles('apps/desktop/src/**', 'crates/lain-client/src/**', 'crates/lain-api/src/**') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/Cargo.lock') }}-
            desktop-${{ runner.os }}-
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  conformance:
    name: conformance (lain server)
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Embed the web build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: crates/lain/webui
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustc --version
      - name: ffmpeg (watch suite clips and transcodes)
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - name: Lint the runner scripts
        run: sh -n conformance/run.sh && sh -n conformance/make-clips.sh && shellcheck conformance/run.sh conformance/make-clips.sh
      - name: Run the suite
        run: LAIN_REQUIRE_FFMPEG=1 conformance/run.sh
      - name: The binary serves the SPA
        run: |
          set -eu
          d=$(mktemp -d)
          LAIN_ACQUIRE_LISTEN_PORT=0 target/debug/lain serve --data-dir "$d" --port 19470 &
          trap 'kill $!' EXIT
          for _ in $(seq 100); do curl -fsS http://127.0.0.1:19470/health >/dev/null 2>&1 && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:19470/library | grep -q '<!doctype html>'
          curl -fsSI http://127.0.0.1:19470/ | grep -qi '^cache-control: no-cache'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19470/api/nope)" = 404

  installer:
    name: installer script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint and test
        run: |
          bash -n scripts/install.sh
          shellcheck scripts/install.sh
          python3 scripts/install_test.py
