[package]
name = "lain"
description = "The lain binary: the server (serve, service, export/import, backup) and the command-line client (login, watch, download)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "lain"
path = "src/main.rs"

[dependencies]
lain-api.workspace = true
lain-admin.workspace = true
lain-bridge.workspace = true
lain-client.workspace = true
lain-core.workspace = true
lain-downloads.workspace = true
lain-lists.workspace = true
lain-metadata.workspace = true
lain-probe.workspace = true
lain-server.workspace = true
lain-store.workspace = true
lain-watch.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
lain-conformance = { path = "../../conformance/runner" }
lain-component.workspace = true
