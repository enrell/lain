# Rust server workspace (D-171, strangler migration). The Go server in
# cmd/ and internal/ stays the production server until cutover.
[workspace]
resolver = "3"
# Standalone benchmark tools with their own dependency trees.
exclude = ["tools/parser-v5"]
members = [
    "crates/lain-api",
    "crates/lain-http",
    "crates/lain-identify",
    "crates/lain-ingest",
    "crates/lain-metadata",
    "crates/lain-subtitle",
    "crates/lain-core",
    "crates/lain-store",
    "crates/lain-auth",
    "crates/lain-component",
    "crates/lain-read",
    "crates/lain-admin",
    "crates/lain-torrent",
    "crates/lain-downloads",
    "crates/lain-acquire",
    "crates/lain-server",
    "crates/lain-client",
    "crates/lain-probe",
    "crates/lain-watch",
    
    "crates/lain-lists",
    "crates/lain-social",
    "crates/lain-bridge",
    "conformance/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
publish = false

# D-172 baseline plus D-173 (argon2 per D-177); versions are pinned exactly and Cargo.lock
# is committed. A crate outside this list needs the owner's approval.
[workspace.dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper = { version = "=1.12.0", default-features = false }
# lain-client (D-179): hyper's own HTTP/1 client connection, driven by
# tokio through hyper-util's `TokioIo`, and http-body-util for bodies.
# Both crates were already in the tree under axum.
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
redb = "=4.5.0"
# D-177: passwords and library PINs, Argon2id in PHC strings.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
# Default features: macOS needs `macos_fsevent` (the crate does not build
# there without it); on Linux and Windows they add nothing.
notify = "=8.2.2"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
# D-173 (Q-043): token hashing, OS randomness, log output.
sha2 = { version = "=0.11.1", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
getrandom = { version = "=0.4.3", features = ["std"] }
# lain-client: the free-space probe of the offline store (statvfs);
# already in the tree on Unix under tokio.
libc = "=0.2.191"
# D-195: raw DEFLATE for comic archives (CBZ), pure Rust; the ZIP
# container itself is read in-tree (crates/lain-read/src/zip.rs).
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
# D-205: SHA-1 for BitTorrent info hashes and piece verification
# (BEP 3 fixes the hash); RustCrypto, pure Rust, same family as sha2.
sha1 = { version = "=0.11.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }
# D-200: outbound HTTPS for lain-http. rustls with the `ring` provider
# (no aws-lc-rs, no OS TLS library), TLS 1.2 + 1.3, and the Mozilla
# root set from webpki-roots (no OS certificate store).
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.11"

lain-api = { path = "crates/lain-api" }
lain-http = { path = "crates/lain-http" }
lain-core = { path = "crates/lain-core" }
lain-store = { path = "crates/lain-store" }
lain-auth = { path = "crates/lain-auth" }
lain-component = { path = "crates/lain-component" }
lain-identify = { path = "crates/lain-identify" }
lain-ingest = { path = "crates/lain-ingest" }
lain-metadata = { path = "crates/lain-metadata" }
lain-subtitle = { path = "crates/lain-subtitle" }
lain-read = { path = "crates/lain-read" }
lain-admin = { path = "crates/lain-admin" }
lain-probe = { path = "crates/lain-probe" }
lain-watch = { path = "crates/lain-watch" }
lain-lists = { path = "crates/lain-lists" }
lain-social = { path = "crates/lain-social" }
lain-torrent = { path = "crates/lain-torrent" }
lain-downloads = { path = "crates/lain-downloads" }
lain-acquire = { path = "crates/lain-acquire" }
lain-bridge = { path = "crates/lain-bridge" }

[profile.dev]
# Keep target/ small on a tight disk; line tables are enough for
# backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Argon2 is unusable unoptimized (every login in the test suites hashes).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Inflating comic pages unoptimized is slow enough to show in tests.
[profile.dev.package.miniz_oxide]
opt-level = 3
