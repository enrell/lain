# User-facing compose: pulls the published image, no build step.
# `scripts/install.sh` generates a filled-in copy of this for your
# paths and port (Docker mode, the recommended setup).
services:
  lain:
    image: ghcr.io/enrell/lain:${LAIN_TAG:-latest}
    container_name: lain
    restart: unless-stopped
    ports:
      - "${LAIN_PORT:-9360}:9360"
    volumes:
      # database, composition, thumbnails, backups of record. The named
      # volume is initialized with the image's lain user ownership, so
      # no user override is needed here.
      - lain-data:/data
      # media roots, read-write so "delete from disk" works (add :ro to forbid it).
      # The container user needs write access to delete files (set `user:` to
      # your uid:gid if your media is not owned by uid 1000).
      - ~/Videos:/media/videos
      # Set LAIN_OMARCHY_CURRENT to mirror the host palette in the web UI.
      - ${LAIN_OMARCHY_CURRENT:-/dev/null}:/omarchy/current:ro
    environment:
      # soft heap cap: GC works harder instead of growing (bbolt mmap
      # pages are reclaimable and don't count against this)
      GOMEMLIMIT: 256MiB
      GOGC: "100"
      LAIN_OMARCHY_COLORS: /omarchy/current/theme/colors.toml
      # Ready transcode artifacts use a plugin-private LRU cache.
      LAIN_TRANSCODE_CACHE_SIZE: ${LAIN_TRANSCODE_CACHE_SIZE:-20GiB}
    # hard cap above the soft one; raise for 50k+ file libraries
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9360/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  lain-data:
